[project]
name = "debtpilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# httpx2, not httpx: starlette.testclient deprecated the latter and emits a
# DeprecationWarning on import, which would make test output non-pristine.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "httpx2>=0.28"]

[tool.setuptools.packages.find]
# `supabase/` (CLI scaffolding: migrations, config.toml) sits alongside
# `app/` at the backend root; without this, setuptools' flat-layout
# discovery sees two top-level packages and refuses to build.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["if TYPE_CHECKING:"]
