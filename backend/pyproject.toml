[project]
name = "debtpilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app.api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# A Protocol declares a shape and has no runtime behaviour: its method
# bodies are `...` and are never executed by anything.
exclude_lines = ["if TYPE_CHECKING:", "class \\w+\\(Protocol\\):"]
